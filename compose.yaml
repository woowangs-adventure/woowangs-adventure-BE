name: robot-inspection

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-robot_inspection}
      POSTGRES_USER: ${POSTGRES_USER:-robot_local_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-robot_local_dev_password}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-robot_local_dev} -d ${POSTGRES_DB:-robot_inspection}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

volumes:
  postgres_data:
