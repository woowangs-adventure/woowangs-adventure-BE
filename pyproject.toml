[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "woowangs-adventure-backend"
version = "0.1.0"
description = "FastAPI gateway for TurtleBot3 SLAM data and dashboard clients."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.16,<2.0",
  "asyncpg>=0.29,<1.0",
  "fastapi>=0.133,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "uvicorn[standard]>=0.41,<1.0",
  "websockets>=15,<17",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.9,<3.0",
  "pytest>=8.3,<10.0",
  "ruff>=0.11,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
